plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    compileSdk 34
    namespace 'com.vadym.gvd.bestfriendskotlin'

    defaultConfig {
        applicationId "me.vadym.adv.tfprayer"
        minSdk 26
        targetSdk 34
        versionCode 31
        versionName "4.10"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    kotlin {
        jvmToolchain(17)
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    packaging {
        resources {
            excludes += ['META-INF/rxjava.properties']
        }
    }

    lint {
        disable 'MissingTranslation'
    }
}

dependencies {
    // ── Kotlin ───────────────────────────────────────────────────
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    // ── AndroidX ─────────────────────────────────────────────────
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'

    // ── Material ──────────────────────────────────────────────────
    implementation 'com.google.android.material:material:1.12.0'

    // ── Firebase ──────────────────────────────────────────────────
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-crashlytics-ktx'
    implementation 'com.google.firebase:firebase-storage-ktx'
    implementation 'com.google.firebase:firebase-database-ktx'

    // ── Ads ───────────────────────────────────────────────────────
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.1.0'

    // ── RxJava (всі з одної мажорної версії) ─────────────────────
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'io.reactivex.rxjava2:rxkotlin:2.4.0'

    // ── Image Loading ─────────────────────────────────────────────
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.google.android.gms:play-services-analytics-impl:18.2.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // ── YouTube Player ────────────────────────────────────────────
    implementation 'com.pierfrancescosoffritti.androidyoutubeplayer:core:12.1.1'
    implementation 'com.pierfrancescosoffritti.androidyoutubeplayer:chromecast-sender:0.30'

    // ── Other ─────────────────────────────────────────────────────
    implementation 'org.jsoup:jsoup:1.18.3'
    implementation 'com.github.FrancescoJo:korean-lunar-calendar:1.0.2'

    // ── Tests ─────────────────────────────────────────────────────
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    // ── Runtime ───────────────────────────────────────────────────
    implementation "androidx.work:work-runtime-ktx:2.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
}